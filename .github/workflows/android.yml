name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Also build a release APK (uses signing secrets when present)'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Jest (unit + database integration)
        run: npm run test:ci

  apk:
    name: Build debug APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          # The runner image ships the SDK and command-line tools, so sdkmanager
          # is called directly. android-actions/setup-android is avoided on
          # purpose: it shells out to `sdkmanager tools`, a package that no
          # longer exists, and fails the job before anything is installed.
          #
          # Versions must match android/build.gradle, which mirrors
          # node_modules/react-native/gradle/libs.versions.toml for RN 0.88:
          # compileSdk 37, buildTools 37.0.0, targetSdk 36, NDK 27.1.12297006.
          # The NDK is needed to strip the prebuilt native libraries.
          # API 37 is published under the minor-versioned name android-37.0;
          # plain "platforms;android-37" does not exist. NDK 27 is needed to
          # strip the prebuilt .so files. CMake is not installed: this project
          # has no native code, and 3.22.1 is no longer in the SDK repository.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-37.0" \
            "build-tools;37.0.0" "ndk;27.1.12297006"
          "$SDKM" --list_installed | head -40

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug and release APKs
        working-directory: android
        run: |
          chmod +x gradlew
          # debug   - the sideload build, now with the JS bundle embedded
          # release - same code, debug-signed only when no keystore secret exists
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Collect APKs and verify the JS bundle is inside
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/general-store-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/general-store-release.apk
          cp -r android/app/build/outputs/logs artifacts/gradle-logs || true
          ls -la artifacts
          # An APK without the bundle only starts when Metro is reachable, which
          # is not what an offline store app is supposed to need.
          for apk in artifacts/*.apk; do
            echo "== $apk"
            unzip -l "$apk" | grep -q "assets/index.android.bundle" \
              || { echo "::error::$apk does not contain assets/index.android.bundle"; exit 1; }
          done
          echo "Both APKs contain the JS bundle."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: general-store-debug-apk
          path: artifacts/general-store-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: general-store-release-apk
          path: artifacts/general-store-release.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: general-store-debug-logs
          path: artifacts
          if-no-files-found: warn

  release:
    name: Build release APK (signed when secrets exist)
    needs: apk
    if: github.event_name == 'workflow_dispatch' && inputs.build_release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-37.0" \
            "build-tools;37.0.0" "ndk;27.1.12297006"

      # `secrets` is not an available context inside `if:`, and referencing it
      # there makes the whole workflow file invalid. Pass it in through `env`
      # and decide inside the script instead.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/ci-release.keystore"
            echo "path=$GITHUB_WORKSPACE/android/app/ci-release.keystore" >> "$GITHUB_OUTPUT"
            echo "Signing with the keystore from ANDROID_KEYSTORE_BASE64."
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; the release APK will be signed with the debug key and is NOT distributable."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: general-store-release-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
