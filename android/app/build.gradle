apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Autolinking with the React Native community CLI. */
    autolinkLibrariesWithApp()

    /*
     * Bundle the JS into the debug APK too. The default (['debug']) leaves the
     * bundle out, which makes an APK copied to a phone show "Unable to load
     * script" unless Metro is running on the same network - useless for the
     * offline test install this project ships. With the bundle embedded the
     * app starts on its own; when Metro is reachable, dev support still
     * prefers the live bundle, so `npm run android` keeps working.
     */
    debuggableVariants = []
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing.
 *
 * Locally: put a `release.keystore` in android/app/ and a `keystore.properties`
 *          next to it (never commit either).
 * CI:      provide ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD /
 *          ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD as repository secrets.
 *
 * When no keystore is configured the release build falls back to the debug
 * key so `assembleRelease` still produces an installable artifact for testing.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProperties.getProperty("storeFile")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProperties.getProperty("storePassword")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProperties.getProperty("keyAlias")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProperties.getProperty("keyPassword")
def hasReleaseKeystore = releaseStoreFile != null && new File(releaseStoreFile).exists()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.generalstore"
    defaultConfig {
        applicationId "com.generalstore"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        // No placeholders left in the manifest: cleartext traffic is off.
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-ktx:1.13.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
